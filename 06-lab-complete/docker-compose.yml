# Chạy agent + redis:  docker compose up --build
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false          # không có .env vẫn chạy được
    environment:
      # Lấy từ shell hoặc .env (compose tự đọc .env để thay biến) — không ghi key ở đây
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
