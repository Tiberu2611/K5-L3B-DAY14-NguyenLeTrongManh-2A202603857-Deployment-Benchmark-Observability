# Railway — build bằng Dockerfile, CMD trong Dockerfile lắng nghe theo $PORT Railway cấp.
# Biến môi trường (AGENT_API_KEY, REDIS_URL...) đặt bằng `railway variables`, không ghi ở đây.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
