# Exercise 7.3 — Quality gate: chạy eval trên golden dataset ở mỗi PR.
# run_eval.py trả exit code 1 khi accuracy < ngưỡng hoặc có regression
# → step fail → job fail → branch protection (required check) chặn merge.
name: quality-gate
on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/**"
jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start agent v2
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 MOCK_SLOW_RATE=0 PORT=8000 python app.py &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Run eval (fail nếu accuracy < 85%)
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --out eval_ci.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: 06-lab-complete/benchmark-observability/develop/eval_ci.json
